# SPDX-License-Identifier: Apache-2.0 OR MIT
version: "2"
run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - revive

linters-settings:
  govet:
    enable-all: true
  gosec:
    severity: medium
    confidence: medium
